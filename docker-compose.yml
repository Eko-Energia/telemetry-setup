name: perla-telemetry-stack
services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config
      - ./mq-data:/mosquitto/data
      - ./mq-log:/mosquitto/log

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=100y"
      # VM assumes Prometheus-style slow scrapes and hides/flattens the newest
      # points (default 30s) as "possibly incomplete". With 200ms telemetry that
      # would delay the live edge of every graph - the data is already on disk.
      - "-search.latencyOffset=0s"
      # NOTE: do NOT add -dedup.minScrapeInterval - it would drop sub-second samples.
    volumes:
      - ./vm-data:/victoria-metrics-data

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - victoriametrics
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/can_decode.star:/etc/telegraf/can_decode.star:ro
    ports:
      - "8000:8000"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "3000:3000"
    environment:
      # Pit-wall monitors can view dashboards without logging in (read-only).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_MIN_REFRESH_INTERVAL=200ms
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=200ms
    volumes:
      # Grafana runs as uid 472 - a bind-mount would be root-owned and unwritable,
      # so its data lives in a named volume (Docker handles ownership).
      - grafana-data:/var/lib/grafana
      # Provisioning is read-only config (tracked in git) - auto-adds the VM datasource.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  grafana-data:
