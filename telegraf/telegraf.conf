# Telegraf: MQTT (dbc-can-bridge) / HTTP -> starlark decode -> VictoriaMetrics
#
# Global agent settings. Defaults are sensible; kept here for clarity.
[agent]
  ## mqtt_consumer is a streaming (service) input - data arrives asynchronously.
  ## flush_interval controls how often a batch is sent to VM, so it drives how "live"
  ## the data looks in VM/Grafana. 200ms matches the dashboard refresh rate, so the
  ## write path is not the bottleneck for near real-time pit dashboards.
  flush_interval = "200ms"
  ## Do not add a "host" tag to metrics. The container hostname is a random Docker ID
  ## that changes on recreate/update, which would spawn new time series in VM.
  omit_hostname = true
  metric_buffer_limit = 100000
  ## One 200ms flush carries every signal decoded from the CAN payloads in that
  ## window, which easily exceeds the default 1000 and would be split into several
  ## writes per flush.
  metric_batch_size = 5000


# # Read metrics from MQTT topic(s)
[[inputs.mqtt_consumer]]
  ## Broker URLs for the MQTT server or cluster.
  servers = ["tcp://mosquitto:1883"]

  ## Topics that will be subscribed to.
  topics = [
    "messages",
  ]

  topic_tag = ""
  qos = 1
  max_reconnect_interval = "30s"
  max_undelivered_messages = 5000
  persistent_session = true
  client_id = "telegraf-can"

  ## Data format to consume.
  ## "value" + data_type="string" pulls the whole payload as a single string into
  ## the "value" field; the actual JSON parsing is done by the starlark processor
  data_format = "value"
  data_type = "string"


# # Bypassing MQTT: Read metrics directly via HTTP POST
[[inputs.http_listener_v2]]
  ## Port, na którym Telegraf będzie nasłuchiwał żądań HTTP
  service_address = ":8000"
  
  ## Ścieżka do wysyłania danych
  paths = ["/telegraf"]
  
  ## Akceptowane metody
  methods = ["POST"]
  
  ## Format danych. Ustawiony dokładnie tak samo jak w [[inputs.mqtt_consumer]],
  ## aby procesor starlark mógł zająć się parsowaniem surowego JSON-a w polu "value".
  data_format = "value"
  data_type = "string"


# Decode the CAN payload (snapshot/update) into can_signal metrics.
[[processors.starlark]]
  script = "/etc/telegraf/can_decode.star"


# Write to VictoriaMetrics via InfluxDB line protocol (VM listens on :8428/write).
[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  ## VM does not use "databases" - disable the CREATE DATABASE attempt,
  ## which VM does not support.
  skip_database_creation = true
