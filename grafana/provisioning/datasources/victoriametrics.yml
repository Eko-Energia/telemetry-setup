apiVersion: 1

# Auto-provision VictoriaMetrics as a datasource so Grafana has it from first boot.
# VM speaks the Prometheus query API, so the datasource type is "prometheus".
datasources:
  - name: VictoriaMetrics
    type: prometheus
    # Fixed uid so dashboards-as-code can reference this datasource deterministically.
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      # Lower bound for the query step. This is NOT the dashboard refresh rate -
      # it is the finest resolution a zoomed-in panel can ever ask for. 1ms is the
      # floor of what VM can represent (millisecond timestamps), and the 512 kbps
      # CAN bus cannot deliver a single signal faster than that anyway.
      timeInterval: "1ms"
